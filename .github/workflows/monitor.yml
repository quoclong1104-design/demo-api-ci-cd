name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công bằng tay

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chạy kịch bản Monitor trực tiếp từ Cloud
        run: postman collection run "59169349-fcfe0fb4-f8e6-4abd-b841-d29e8282410c"
